version: "3.9"

services:
  portfolio:
    build: .
    container_name: portfolio
    ports:
      - "8500:8500"
    volumes:
      - ./favorites.json:/app/favorites.json
    command: >
      streamlit run portfolio.py
      --server.port=8500
      --server.headless=true
      --server.enableCORS=false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8500/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  stock-pc:
    build: .
    container_name: stock_pc
    ports:
      - "8501:8501"
    volumes:
      - ./favorites.json:/app/favorites.json
    command: >
      streamlit run app.py
      --server.port=8501
      --server.headless=true
      --server.enableCORS=false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  stock-mobile:
    build: .
    container_name: stock_mobile
    ports:
      - "8502:8502"
    volumes:
      - ./favorites.json:/app/favorites.json
    command: >
      streamlit run app_mobile.py
      --server.port=8502
      --server.headless=true
      --server.enableCORS=false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8502/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
